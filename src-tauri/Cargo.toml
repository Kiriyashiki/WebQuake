[package]
name = "KyoQuake"
version = "1.3.0"
description = "KyoQuake"
authors = ["Kiriyashiki"]
license = "MIT"
repository = "https://github.com/Kiriyashiki/WebQuake"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s" # optimize for size

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2.10.2"
tauri-plugin-http = "2.9.0"
tauri-plugin-opener = "2.7.3"
dirs = "6.0.0"

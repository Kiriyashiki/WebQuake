[package]
name = "KyoQuake"
version = "0.2.1"
description = "KyoQuake"
authors = ["Kiriyashiki"]
license = "MIT"
repository = "https://github.com/Kiriyashiki/WebQuake"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s" # optimize for size

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2.5.4"
dirs = "6.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
